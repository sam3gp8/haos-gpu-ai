name: "Ollama (GPU-AI Universal)"
version: "0.1.0"
slug: ollama_gpu_ai
description: >-
  Ollama LLM server with universal GPU acceleration (NVIDIA / Intel / AMD),
  built for the HAOS GPU-AI host. Serves local models to Home Assistant.
url: "https://github.com/sam3gp8/haos-gpu-ai"
arch:
  - amd64
init: false
startup: services
boot: auto
host_network: false
ports:
  11434/tcp: 11434
ports_description:
  11434/tcp: "Ollama API"
map:
  - share:rw

# --- GPU access -------------------------------------------------------------
# full_access grants the container the entire host /dev tree, so it sees
# WHICHEVER GPU is present (NVIDIA nodes, or /dev/dri + /dev/kfd) on this box.
#
# This is the pragmatic path for a *universal* add-on: an explicit `devices:`
# list that names /dev/nvidia0 would fail to start on an Intel/AMD host where
# that node does not exist. If you build vendor-specific add-ons instead, drop
# full_access and use a narrow devices list (see the commented block below).
#
# Trade-off: full_access is broad. Acceptable for a single-tenant homelab
# appliance; tighten if you run untrusted add-ons.
full_access: true

# NVIDIA path: with the host's conditional "default-runtime": "nvidia", these
# env vars tell the runtime hook which devices/capabilities to inject.
environment:
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  OLLAMA_HOST: "0.0.0.0"
  # Flash attention: required for KV-cache quantization to be legal (without it,
  # a q8_0 KV cache makes llama-server segfault: "V cache quantization requires
  # flash_attn"). It's also faster and lower-VRAM on Turing+/Ada (your 4090).
  OLLAMA_FLASH_ATTENTION: "1"
  # KV-cache type: left at the f16 default here. With flash attention ON (above)
  # you may set this to "q8_0" to roughly halve KV-cache VRAM and fit larger
  # models / longer context on 24 GB — safe now that flash attention is enabled.
  # OLLAMA_KV_CACHE_TYPE: "q8_0"

# --- Vendor-specific alternative (instead of full_access) -------------------
# devices:
#   - /dev/dri          # Intel + AMD render nodes
#   - /dev/kfd          # AMD ROCm compute
#   # NVIDIA needs no devices here when default-runtime=nvidia is active.
