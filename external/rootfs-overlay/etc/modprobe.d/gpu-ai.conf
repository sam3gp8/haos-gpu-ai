# HAOS GPU/AI unified module policy
#
# Blacklist nouveau so the proprietary NVIDIA driver can bind the card. This is
# inert on non-NVIDIA hosts (nouveau simply never loads there anyway).
blacklist nouveau
options nouveau modeset=0

# NVIDIA DRM modeset is required for correct display/DRM KMS and for the
# nvidia-drm.ko node the container toolkit relies on.
options nvidia-drm modeset=1

# nvidia-uvm: enable persistence-friendly behaviour for long-lived LLM
# processes that keep large VRAM allocations mapped across requests.
options nvidia NVreg_PreserveVideoMemoryAllocations=1

# amdgpu: expose all supported ASICs and enable large-BAR / GTT sizing helpful
# for large-context models. Harmless on non-AMD hosts.
options amdgpu gttsize=-1
